<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nontawat Profile 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Monomaniac+One&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <style>
      body {
        background-color: black;
        margin: 0;
        padding: 0;
      }
      a {
        color: #ffffff;
        text-decoration: none;
      }
      a:hover {
        color: #01D5A2;
      }
      .menu a {
        font-family: 'Monomaniac One';
      }
      .nav-bar {
        display: flex;
        align-items: center;
        margin: 50px 150px;
      }
      .nav-menu, .nav-logo, .nav-icon {
        width: 100%;
        display: flex;
      }
      .nav-menu {
        justify-content: flex-start;
        gap: 50px
      }
      .nav-logo {
        justify-content: center;
      }
      .nav-icon {
        justify-content: flex-end;
        gap: 30px;
      }
      
      span {
        font-family: 'Monomaniac One';
        color: #ffffff;
        font-size: 3rem;
      }
      .p-job span{
        color: #01D5A2;
      }
      .profile-info {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-top: 120px;
      }
      .profile-picture {
        display: flex;
        justify-content: center;
        margin-top: 50px;
      }
      .profile-picture img {
        width: 300px;
        height: 300px;
        border: 2px solid #01D5A2;
        border-radius: 50%;
        padding: 7px;
      }
    </style>
  </head>
  <body>
     <!-- Navbar -->
     <div class="nav-bar">
        <!-- Navbar Menu -->
        <div class="nav-menu">
            <a href="#">Portfolio</a>
            <a href="#">About</a>
            <a href="#">Get in Touch</a>
        </div> 
        <!-- Navbar Logo -->
        <div class="nav-logo">
            <img src="./images/hello.png" alt="">
        </div> 
        <!-- Navbar Icons -->
        <div class="nav-icon">
            <a href="#"><i class="bi bi-github"></i></a>
            <a href="#"><i class="bi bi-instagram"></i></a>
            <a href="#"><i class="bi bi-twitter"></i></a>
            <a href="#"><i class="bi bi-linkedin"></i></a>
        </div>
     </div>

     <!-- Profile Info -->
    <div class="profile-info">
        <div class="p-name">
            <span>Nontawat Hemkun</span>
        </div>
        <div class="p-job">
            <span>Freelance Developer</span>
        </div>
        <div class="p-state">
            <span>Based in Thailand</span>
        </div>
    </div>

     <!-- Profile Picture -->
     <div class="profile-picture">
        <img src="./images/Ellipse 1.jpg" alt="">
     </div>
  </body>
</html>
